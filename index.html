<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý file</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#17212b;--mute:#5b6773;--line:#d5dbe3;--acc:#2457d6;--acc-ink:#fff;--bad:#b3261e;--ok:#17803d}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e8edf2;--mute:#9aa7b4;--line:#2a3441;--acc:#6f95ff;--acc-ink:#0b1220;--bad:#ff8a80;--ok:#6fdc97}}
*{box-sizing:border-box}
body{margin:0;padding:16px 16px 40px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto}
h1{font-size:1.4rem;margin:8px 0 16px}
h2{font-size:1.05rem;margin:0 0 4px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.9rem;color:var(--mute);margin:12px 0 4px}
input{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:600;padding:12px 16px;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);margin-top:16px;width:100%}
button:disabled{opacity:.6}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);width:auto;margin:0;padding:8px 12px}
button.ghost.bad{color:var(--bad)}
.msg{min-height:1.4em;margin:12px 0 0;font-size:.95rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.hint{font-size:.85rem;color:var(--mute);margin:4px 0 0}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
li p{margin:2px 0 0;font-size:.85rem;color:var(--mute);word-break:break-all}
.top{display:flex;justify-content:space-between;align-items:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Quản lý file</h1>
    <button class="ghost" id="logout" hidden>Đăng xuất</button>
  </div>

  <section id="loginBox">
    <h2>Đăng nhập admin</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pass">Mật khẩu</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <button type="submit">Đăng nhập</button>
    </form>
    <p class="msg" id="loginMsg"></p>
  </section>

  <div id="app" hidden>
    <section>
      <h2>Thêm file mới</h2>
      <form id="addForm">
        <label for="name">Tên nút hiển thị trong app</label>
        <input id="name" required maxlength="60" placeholder="Ví dụ: Gói cấu hình 1">
        <label for="target">Thư mục đích trên điện thoại</label>
        <input id="target" required placeholder="Android/data/com.ten.game/files">
        <p class="hint">Phải bắt đầu bằng Android/data/ và tên gói của app đích.</p>
        <label for="file">Chọn một hoặc nhiều file</label>
        <input id="file" type="file" multiple required>
        <p class="hint">Các file gửi chung một lần sẽ được dán cùng lúc bằng một nút.</p>
        <button type="submit" id="addBtn">Tải lên và thêm</button>
      </form>
      <p class="msg" id="addMsg"></p>
    </section>

    <section>
      <h2>Kho link lấy key</h2>
      <p class="hint" id="poolInfo">Đang đếm...</p>
      <form id="poolForm">
        <label for="ltoken">Token Layma (không được lưu lại)</label>
        <input id="ltoken" type="password" autocomplete="off" required>
        <label for="lcount">Số link cần tạo thêm</label>
        <input id="lcount" type="number" min="1" max="100" value="20" required>
        <button type="submit" id="poolBtn">Tạo link</button>
      </form>
      <p class="msg" id="poolMsg"></p>
    </section>

    <section>
      <h2>Danh sách đang có trong app</h2>
      <p class="hint" id="empty" hidden>Chưa có mục nào. Hãy thêm file đầu tiên ở trên.</p>
      <ul id="list"></ul>
    </section>
  </div>
</main>

<script>
const API = 'https://pshqmstyjfqbkwxdisxy.supabase.co';
const KEY = 'sb_publishable_f8ZqvUYGVdt1B12T1n7wgw_5HyEbTXL';
const BUCKET = 'files';
let token = null;

const $ = id => document.getElementById(id);
const say = (el, text, ok) => { el.textContent = text; el.className = 'msg' + (ok === undefined ? '' : ok ? ' ok' : ' bad'); };
const auth = () => ({ apikey: KEY, Authorization: 'Bearer ' + token });
const errText = async (r, fallback) => { try { const d = await r.json(); return d.message || d.msg || fallback; } catch (e) { return fallback; } };

function expired() {
  token = null;
  $('app').hidden = true; $('logout').hidden = true; $('loginBox').hidden = false;
  say($('loginMsg'), 'Phiên đã hết hạn, hãy đăng nhập lại.', false);
}

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  say($('loginMsg'), 'Đang đăng nhập...');
  try {
    const r = await fetch(API + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value.trim(), password: $('pass').value })
    });
    if (!r.ok) throw new Error('Sai email hoặc mật khẩu.');
    token = (await r.json()).access_token;
    say($('loginMsg'), '');
    $('pass').value = '';
    $('loginBox').hidden = true; $('app').hidden = false; $('logout').hidden = false;
    load();
    poolCount();
  } catch (err) {
    say($('loginMsg'), err.message === 'Failed to fetch' ? 'Không kết nối được. Kiểm tra mạng.' : err.message, false);
  }
};

$('logout').onclick = () => { token = null; location.reload(); };

const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
const findLink = (v, dest) => {
  if (typeof v === 'string') return /^https?:\/\//.test(v.trim()) && v.trim() !== dest ? v.trim() : '';
  if (v && typeof v === 'object') for (const x of Object.values(v)) { const r = findLink(x, dest); if (r) return r; }
  return '';
};

async function poolCount() {
  const r = await fetch(API + '/rest/v1/link_pool?select=id&used=eq.false', { headers: auth() });
  if (r.status === 401) return expired();
  const d = await r.json();
  $('poolInfo').textContent = Array.isArray(d)
    ? `Còn ${d.length} link chưa dùng. Mỗi lần người dùng bấm "Lấy key" sẽ dùng 1 link.`
    : 'Chưa đọc được kho link (bạn đã chạy SQL tạo bảng link_pool chưa?).';
}

$('poolForm').onsubmit = async e => {
  e.preventDefault();
  const msg = $('poolMsg'), btn = $('poolBtn');
  const n = Math.min(100, Math.max(1, parseInt($('lcount').value) || 1));
  btn.disabled = true;
  const rows = [];
  let error = null;
  try {
    const rs = await fetch(API + '/rest/v1/settings?select=shortener_url,claim_page_url&id=eq.1', { headers: auth() });
    const s = (await rs.json())[0];
    if (!s || !s.shortener_url || !s.claim_page_url)
      throw new Error('Chưa điền shortener_url hoặc claim_page_url trong bảng settings.');
    const tk = encodeURIComponent($('ltoken').value.trim());
    for (let i = 0; i < n; i++) {
      say(msg, `Đang tạo link ${i + 1}/${n}...`);
      const t = hex(24);
      const dest = new URL(s.claim_page_url);
      dest.searchParams.set('t', t);
      const url = s.shortener_url.replace('{TOKEN}', tk).replace('{URL}', encodeURIComponent(dest.toString()));
      let text;
      try { text = (await (await fetch(url)).text()).trim(); }
      catch (err) { throw new Error('Trình duyệt không gọi được Layma (có thể Layma không cho gọi từ trang web). Hãy báo mình để đổi cách.'); }
      let link = '';
      try { link = findLink(JSON.parse(text), dest.toString()); } catch (err) { link = findLink(text, dest.toString()); }
      if (!/^https?:\/\//.test(link)) throw new Error('Layma trả về: ' + text.slice(0, 120));
      rows.push({ token: t, short_link: link });
      await new Promise(r => setTimeout(r, 300));
    }
  } catch (err) {
    error = err;
  }
  if (rows.length) {
    const r = await fetch(API + '/rest/v1/link_pool', {
      method: 'POST',
      headers: { ...auth(), 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(rows)
    });
    if (r.status === 401) { btn.disabled = false; return expired(); }
    if (!r.ok && !error) error = new Error(await errText(r, 'Lưu kho link thất bại.'));
  }
  if (error) say(msg, error.message + (rows.length ? ` Đã lưu ${rows.length} link tạo được.` : ''), false);
  else say(msg, `Đã tạo thêm ${rows.length} link.`, true);
  btn.disabled = false;
  poolCount();
};

async function load() {
  const r = await fetch(API + '/rest/v1/items?select=*&order=created_at.asc', { headers: auth() });
  if (r.status === 401) return expired();
  const items = await r.json();
  const groups = new Map();
  items.forEach(it => {
    const k = it.name + '|' + it.target_path;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  });
  const box = $('list');
  box.innerHTML = '';
  $('empty').hidden = groups.size > 0;
  groups.forEach(list => {
    const li = document.createElement('li');
    const info = document.createElement('div');
    const b = document.createElement('b'); b.textContent = list[0].name;
    const p1 = document.createElement('p'); p1.textContent = list[0].target_path;
    const p2 = document.createElement('p'); p2.textContent = list.length + ' file: ' + list.map(x => x.file_name).join(', ');
    info.append(b, p1, p2);
    const del = document.createElement('button');
    del.className = 'ghost bad'; del.textContent = 'Xóa';
    del.onclick = () => remove(list);
    li.append(info, del);
    box.append(li);
  });
}

$('addForm').onsubmit = async e => {
  e.preventDefault();
  const msg = $('addMsg'), btn = $('addBtn');
  const files = Array.from($('file').files);
  const name = $('name').value.trim();
  const target = $('target').value.trim().replace(/^\/+|\/+$/g, '');
  if (!/^Android\/data\/[^/]+/.test(target) || target.includes('..'))
    return say(msg, 'Thư mục đích phải có dạng Android/data/tên.gói.app', false);
  btn.disabled = true;
  const rows = [], uploaded = [];
  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      say(msg, `Đang tải lên ${i + 1}/${files.length}: ${file.name}`);
      const key = Date.now() + '_' + i + '_' + file.name.replace(/[^\w.\-]+/g, '_');
      const r = await fetch(`${API}/storage/v1/object/${BUCKET}/${key}`, {
        method: 'POST',
        headers: { ...auth(), 'Content-Type': file.type || 'application/octet-stream' },
        body: file
      });
      if (r.status === 401) return expired();
      if (!r.ok) throw new Error(file.name + ': ' + await errText(r, 'tải lên thất bại.'));
      uploaded.push(key);
      rows.push({ name, target_path: target, file_name: file.name,
        file_url: `${API}/storage/v1/object/public/${BUCKET}/${key}` });
    }
    const r = await fetch(API + '/rest/v1/items', {
      method: 'POST',
      headers: { ...auth(), 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(rows)
    });
    if (!r.ok) throw new Error(await errText(r, 'Lưu vào danh sách thất bại.'));
    say(msg, `Đã thêm ${files.length} file. App sẽ tự hiện nút mới.`, true);
    $('addForm').reset();
    load();
  } catch (err) {
    for (const k of uploaded)
      fetch(`${API}/storage/v1/object/${BUCKET}/${encodeURIComponent(k)}`, { method: 'DELETE', headers: auth() });
    say(msg, err.message + ' Chưa có file nào được thêm.', false);
  } finally {
    btn.disabled = false;
  }
};

async function remove(list) {
  if (!confirm(`Xóa "${list[0].name}" (${list.length} file)?`)) return;
  const ids = list.map(x => x.id).join(',');
  await fetch(`${API}/rest/v1/items?id=in.(${ids})`, { method: 'DELETE', headers: auth() });
  for (const it of list) {
    const key = decodeURIComponent((it.file_url.split('/object/public/' + BUCKET + '/')[1]) || '');
    if (key) await fetch(`${API}/storage/v1/object/${BUCKET}/${encodeURIComponent(key)}`, { method: 'DELETE', headers: auth() });
  }
  load();
}
</script>
</body>
</html>
